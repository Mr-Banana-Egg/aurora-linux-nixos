name: update-aurora-kernel

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.AUTO_UPDATE_TOKEN || secrets.GITHUB_TOKEN }}

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

      - name: Find new release
        id: rel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh api repos/omacom/linux-aurora/releases/latest --jq .tag_name)
          [[ $latest =~ ^aurora-[0-9]{4}\.[0-9]{2}\.[0-9]{2}\.[0-9]+$ ]] \
            || { echo "unexpected tag: $latest"; exit 1; }
          current=$(grep -oP 'omacom/linux-aurora/\Kaurora-[0-9.]+' flake.nix)
          newest=$(printf '%s\n%s\n' "$current" "$latest" | sort -V | tail -1)
          echo "latest=$latest"   >> "$GITHUB_OUTPUT"
          echo "current=$current" >> "$GITHUB_OUTPUT"
          if [[ $latest != "$current" && $newest == "$latest" ]]; then
            echo "new=true" >> "$GITHUB_OUTPUT"
          else
            echo "new=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump tag, update flake, open PR
        if: steps.rel.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ secrets.AUTO_UPDATE_TOKEN || secrets.GITHUB_TOKEN }}
          LATEST: ${{ steps.rel.outputs.latest }}
          CURRENT: ${{ steps.rel.outputs.current }}
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          branch="auto/${LATEST}"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            echo "branch $branch exists, skipping"; exit 0
          fi

          sed -i "s|omacom/linux-aurora/aurora-[0-9.]*|omacom/linux-aurora/${LATEST}|" flake.nix
          nix flake update            # all inputs; use `nix flake update aurora-kernel` for kernel only
          nix flake check
          nix build .#aurora-kernel --dry-run

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -am "aurora-kernel: ${CURRENT} -> ${LATEST}; flake update"
          git push -u origin "$branch"

          gh pr create --base "$BASE" --head "$branch" \
            --title "aurora-kernel ${CURRENT} -> ${LATEST}" \
            --body "Release: https://github.com/omacom/linux-aurora/releases/tag/${LATEST}

          Also ran \`nix flake update\`."
